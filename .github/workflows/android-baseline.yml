name: Android Baseline

on:
  push:
    branches:
      - phase-1-baseline
  pull_request:
    branches:
      - phase-1-baseline
  workflow_dispatch:

jobs:
  android-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-android-arm64-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
