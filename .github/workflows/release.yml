name: Release

# Publishing a release is just tagging: `git tag v0.1.0 && git push origin v0.1.0`.
# This workflow builds the Android split-per-abi APKs and the unsigned
# iOS IPA, then creates a GitHub Release on the tag and attaches them all.
# (No AAB — Play Store publishing isn't set up yet.)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Rename artifacts with app name and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "DreamPlayer-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk "DreamPlayer-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "DreamPlayer-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk "DreamPlayer-${VERSION}-x86_64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-android
          path: |
            build/app/outputs/flutter-apk/DreamPlayer-*.apk

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -ryq "DreamPlayer-${VERSION}.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-ios
          path: DreamPlayer-*.ipa

  tvos:
    name: Build unsigned tvOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos precache
          flutter-tvos doctor -v

      - name: Scaffold tvOS project
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          TMPDIR=$(mktemp -d)
          flutter-tvos create --platforms=tvos "$TMPDIR/scaffold"
          rm -rf tvos
          cp -r "$TMPDIR/scaffold/tvos" tvos
          rm -rf "$TMPDIR"
          cp ios/Runner/BufferedSMBReader.swift tvos/Runner/
          cp ios/Runner/CacheCleaner.swift tvos/Runner/
          cp ios/Runner/JellyfinDiscovery.swift tvos/Runner/
          cp ios/Runner/WebDAVClient.swift tvos/Runner/
          cp -f tvos/Runner/AvPlayerView.swift tvos/Runner/AvPlayerView.swift
          cp -f tvos/Runner/AppDelegate.swift tvos/Runner/AppDelegate.swift
          cp -f tvos/Runner/SceneDelegate.swift tvos/Runner/SceneDelegate.swift
          cp -f tvos/Runner/FileBrowser.swift tvos/Runner/FileBrowser.swift

      - name: Fetch dependencies
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos pub get

      - name: Build unsigned tvOS app
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos build tvos --no-codesign --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload
          cp -r build/tvos/Release-appletvos/Runner.app Payload/
          zip -ryq "DreamPlayer-tvOS-alpha-${VERSION}.ipa" Payload

      - name: Upload tvOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-tvos
          path: DreamPlayer-tvOS-alpha-*.ipa

  release:
    name: Create GitHub Release
    needs: [android, ios, tvos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body (changelog entry + install guide)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          {
            echo "## What's new in DreamPlayer $VERSION"
            echo
            cat /tmp/changelog-entry.md
            echo
            cat .github/release_notes.md
          } > /tmp/release-body.md
          echo "BODY=/tmp/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY }}
          generate_release_notes: true
          files: |
            artifacts/dreamplayer-android/**/*.apk
            artifacts/dreamplayer-ios/DreamPlayer-*.ipa
            artifacts/dreamplayer-tvos/DreamPlayer-tvOS-alpha-*.ipa
