name: Release

# Publishing a release is just tagging: `git tag v0.1.0 && git push origin v0.1.0`.
# This workflow builds the Android split-per-abi APKs and the unsigned
# iOS IPA, then creates a GitHub Release on the tag and attaches them all.
# (No AAB — Play Store publishing isn't set up yet.)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Rename artifacts with app name and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "DreamPlayer-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk "DreamPlayer-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "DreamPlayer-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk "DreamPlayer-${VERSION}-x86_64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-android
          path: |
            build/app/outputs/flutter-apk/DreamPlayer-*.apk

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -ryq "DreamPlayer-${VERSION}.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-ios
          path: DreamPlayer-*.ipa

  tvos:
    name: Build unsigned tvOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install flutter-tvos
        run: |
          git clone --depth 1 https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos precache
          flutter-tvos doctor -v

      - name: Scaffold tvOS project
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          TMPDIR=$(mktemp -d)
          flutter-tvos create --platforms=tvos "$TMPDIR/scaffold"
          # Back up our adapted Swift files BEFORE replacing the scaffold —
          # they are committed in tvos/Runner/ and must survive the reset.
          BACKUP=$(mktemp -d)
          cp tvos/Runner/*.swift "$BACKUP/"
          rm -rf tvos
          cp -r "$TMPDIR/scaffold/tvos" tvos
          rm -rf "$TMPDIR"
          # Restore our adapted Swift files over the scaffold defaults.
          cp -f "$BACKUP"/*.swift tvos/Runner/
          rm -rf "$BACKUP"

      - name: Add AetherEngine SPM packages to the Xcode project
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          path = 'tvos/Runner.xcodeproj'
          project = Xcodeproj::Project.open(path)
          target = project.targets.find { |t| t.name == 'Runner' }
          abort('Runner target not found') unless target

          pkg = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
          pkg.repositoryURL = 'https://github.com/superuser404notfound/AetherEngine'
          pkg.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '6.21.0' }
          project.root_object.package_references << pkg

          %w[AetherEngine AetherEngineSMB].each do |name|
            dep = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            dep.package = pkg
            dep.product_name = name
            target.package_product_dependencies << dep
            build_file = project.new(Xcodeproj::Project::Object::PBXBuildFile)
            build_file.product_ref = dep
            target.frameworks_build_phase.files << build_file
          end

          # flutter-tvos has no --no-codesign flag; disable signing in the
          # project instead (equivalent of `flutter build ios --no-codesign`).
          # Also raise the deployment target: AetherEngine requires tvOS 17.
          # The template pins TVOS_DEPLOYMENT_TARGET=15.0 at PROJECT level,
          # which beats a target-level IPHONEOS_DEPLOYMENT_TARGET — so set
          # both names at both levels.
          ([project.build_configurations, target.build_configurations]).each do |configs|
            configs.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['TVOS_DEPLOYMENT_TARGET'] = '17.0'
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
            end
          end

          # The scaffold only compiles its own AppDelegate.swift — add every
          # Swift file we overlay into tvos/Runner/ to the Sources phase.
          runner_group = project.main_group.children.find do |c|
            c.is_a?(Xcodeproj::Project::Object::PBXGroup) && c.path == 'Runner'
          end
          runner_group ||= project.main_group.new_group('Runner', 'Runner')
          existing = target.source_build_phase.files_references.map(&:display_name)
          Dir.glob('tvos/Runner/*.swift').map { |p| File.basename(p) }.each do |name|
            next if existing.include?(name)
            ref = runner_group.files.find { |f| f.display_name == name } ||
                  runner_group.new_reference(name)
            target.source_build_phase.add_file_reference(ref)
            puts "Added #{name} to Runner sources"
          end

          project.save
          puts 'AetherEngine + AetherEngineSMB added to Runner target'
          RUBY

      - name: Add Info.plist network entries
        run: |
          PLIST=tvos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'DreamPlayer finds Jellyfin servers on your local network.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _jellyfin._tcp" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _emby._tcp" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || true

      - name: Fetch dependencies
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos pub get

      - name: Build unsigned tvOS app
        run: |
          export PATH="$HOME/flutter-tvos/bin:$PATH"
          flutter-tvos build tvos --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$(find build -type d -name 'Runner.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found under build/"
            find build -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -ryq "DreamPlayer-tvOS-alpha-${VERSION}.ipa" Payload

      - name: Upload tvOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-tvos
          path: DreamPlayer-tvOS-alpha-*.ipa

  release:
    name: Create GitHub Release
    needs: [android, ios, tvos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body (changelog entry + install guide)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          {
            echo "## What's new in DreamPlayer $VERSION"
            echo
            cat /tmp/changelog-entry.md
            echo
            cat .github/release_notes.md
          } > /tmp/release-body.md
          echo "BODY=/tmp/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY }}
          generate_release_notes: true
          files: |
            artifacts/dreamplayer-android/**/*.apk
            artifacts/dreamplayer-ios/DreamPlayer-*.ipa
            artifacts/dreamplayer-tvos/DreamPlayer-tvOS-alpha-*.ipa
